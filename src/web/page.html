<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mia — флот</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec; --hover: #f0f3f8;
  --accent: #2f6fed; --accent-text: #ffffff; --ok: #1f8a4c; --warn: #b7791f; --crit: #c53030; --off: #8a93a5;
  --ok-bg: #e7f6ed; --warn-bg: #fdf3e1; --crit-bg: #fde8e8; --off-bg: #eef0f4; --shadow: 0 8px 30px rgba(20, 30, 50, .12);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #191d23; --text: #e6e9ef; --muted: #98a1b3; --line: #2a3039; --hover: #20252d;
    --accent: #5b8cff; --accent-text: #0b1020; --ok: #4cc382; --warn: #e3b048; --crit: #ff6b6b; --off: #7d8698;
    --ok-bg: #173325; --warn-bg: #3a2e14; --crit-bg: #3d1a1a; --off-bg: #232830; --shadow: 0 8px 30px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 12px; }
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
button.danger { background: var(--crit); border-color: var(--crit); color: #fff; font-weight: 600; }
button.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
header { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; gap: 5px; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 13px; background: var(--off-bg); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.crit { background: var(--crit-bg); color: var(--crit); }
.grow { flex: 1; }
.search { position: relative; }
.search input { width: 300px; max-width: 60vw; }
.results { position: absolute; top: 40px; right: 0; width: 420px; max-width: 90vw; max-height: 60vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: none; }
.results div { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.results div:hover, .results div.on { background: var(--hover); }
.results small { color: var(--muted); display: block; }
main { padding: 16px 20px 110px; max-width: 1500px; margin: 0 auto; }
.notice { background: var(--warn-bg); color: var(--warn); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 10px; }
.scroll { overflow-x: auto; }
.suggest { display: flex; gap: 10px; flex-wrap: wrap; }
.suggest button { text-align: left; }
.suggest button small { display: block; color: var(--muted); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--panel); }
td.num, th.num { text-align: right; }
td.issues { white-space: normal; min-width: 220px; }
tr.host:hover td { background: var(--hover); }
tr.host.sel td { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
tr.host td:first-child, tr.host td:nth-child(2) { cursor: pointer; }
.state { font-weight: 600; } .ok { color: var(--ok); } .warn { color: var(--warn); } .crit { color: var(--crit); } .off, .muted { color: var(--off); }
.code { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 6px; margin: 1px 3px 1px 0; background: var(--warn-bg); color: var(--warn); }
.code.crit { background: var(--crit-bg); color: var(--crit); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
.bar .who { color: var(--muted); margin-right: 6px; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 10; display: none; flex-direction: column; }
.drawer.open { display: flex; }
.drawer .head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer .head h2 { margin: 0; font-size: 17px; flex: 1; }
.drawer .body { padding: 16px 18px; overflow: auto; flex: 1; }
.drawer .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.shade { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 9; display: none; }
.shade.open { display: block; }
.field { margin-bottom: 12px; }
.field label { display: block; font-weight: 600; margin-bottom: 4px; }
.field .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
.field input[type=text], .field input[type=number], .field input[type=password], .field select, .field textarea { width: 100%; }
.field.inline label { display: inline; font-weight: 500; }
details.more { margin: 8px 0 14px; } details.more summary { cursor: pointer; color: var(--accent); }
.steps { margin: 0; padding: 0; list-style: none; }
.steps li { padding: 6px 0; border-bottom: 1px solid var(--line); }
.plan-head { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.group { padding: 8px 0; border-bottom: 1px solid var(--line); }
.group .who { font-weight: 600; }
.group .now { color: var(--muted); font-size: 13px; margin-top: 2px; }
.group .w { color: var(--warn); font-size: 13px; } .group .b { color: var(--crit); font-size: 13px; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; max-height: 55vh; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
.progress li { display: flex; gap: 8px; padding: 4px 0; } .progress .t { color: var(--muted); margin-left: auto; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -1px; }
@keyframes s { to { transform: rotate(360deg); } }
.big { font-size: 15px; padding: 10px 18px; }
.confirm { background: var(--crit-bg); color: var(--crit); padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
.confirm input { margin-top: 6px; width: 180px; }
.next { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.next button { text-align: left; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
@media (max-width: 700px) { header { padding: 10px 12px; } main { padding: 12px 12px 140px; } .search input { width: 100%; } .hide-s { display: none; } }
</style>
</head>
<body>
<header>
  <h1>mia</h1>
  <div class="chips" id="summary"><span class="chip">загрузка…</span></div>
  <div class="grow"></div>
  <button id="refresh" class="primary">↻ Статус</button>
  <div class="search"><input id="q" placeholder="Найти действие: апдейт, логи, днс…" autocomplete="off"><div class="results" id="found"></div></div>
</header>
<main>
  <div id="notices"></div>
  <div class="card" id="suggestCard" style="display:none"><h2>Что сделать</h2><div class="suggest" id="suggest"></div></div>
  <div class="card scroll">
    <table>
      <thead><tr>
        <th><input type="checkbox" id="all" title="выбрать все"></th><th>хост</th><th>состояние</th><th class="num hide-s">нагрузка</th><th class="num hide-s">память</th><th class="num">диск</th>
        <th>обновления</th><th class="hide-s">ребут</th><th class="hide-s">нода</th><th class="num hide-s">серт.</th><th class="hide-s">tailscale</th><th class="hide-s">панель</th><th>проблемы</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none"></div>
  </div>
  <div class="card scroll" id="extraCard" style="display:none"><h2>Устройства tailnet, которых нет в fleet.yaml</h2><div id="extra"></div></div>
</main>
<div class="bar" id="bar"></div>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer">
  <div class="head"><h2 id="dTitle"></h2><button class="link" id="dClose" title="закрыть (Esc)">✕</button></div>
  <div class="body" id="dBody"></div>
  <div class="foot" id="dFoot"></div>
</aside>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const plural = (n, one, few, many) => (n % 10 === 1 && n % 100 !== 11 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
const hostsWord = (n) => n + ' ' + plural(n, 'сервер', 'сервера', 'серверов');
async function api(path, body) {
  const r = await fetch(path, body === undefined ? { headers: { 'X-Mia': '1' } } : { method: 'POST', headers: { 'X-Mia': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'нет ответа' }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
/** Run a tool as a job: progress events while it runs, the result at the end. */
async function job(tool, args, onProgress) {
  const { id } = await api('api/jobs', { tool, args });
  return new Promise((resolve, reject) => {
    const es = new EventSource('api/jobs/' + id + '/events');
    es.addEventListener('progress', (e) => onProgress && onProgress(JSON.parse(e.data)));
    es.addEventListener('done', (e) => { es.close(); resolve(JSON.parse(e.data)); });
    // обрыв: EventSource переподключается сам и дочитывает пропущенное; закрыт насовсем — задачи на сервере больше нет
    es.onerror = () => { if (es.readyState === EventSource.CLOSED) reject(new Error('задача потеряна (mia перезапускалась?) — проверьте результат в журнале, прежде чем запускать снова')); };
  });
}

const S = { state: null, rows: new Map(), sel: new Set(), last: null, suggest: [], running: new Set() };
const tool = (name) => S.state.tools.find((t) => t.name === name);
const CODES = () => S.state.codes || {};
const CRIT = new Set(['reach', 'disk.full', 'fw.missing', 'fw.inactive', 'fw.exposed', 'fw.default_in', 'fw.public_mgmt', 'ts.down', 'ssh.password', 'docker.inactive', 'node.compose', 'node.secret', 'node.container', 'svc.down', 'panel.disconnected', 'cert.expiring']);
const RU_WARN = [
  [/^docker packages are upgraded: all containers restart/, 'обновляется docker: все контейнеры перезапустятся'],
  [/(\d+) user\(s\) online on (\S+) will reconnect/, '$1 польз. онлайн на $2 переподключатся'],
  [/(\d+) user\(s\) on (\S+) will be disconnected/, '$1 польз. на $2 отключатся'],
  [/(\d+) user\(s\) on (\S+) will reconnect/, '$1 польз. на $2 переподключатся'],
  [/^unreachable: (.*?)( — .*)?$/, 'не отвечает: $1'],
];
const ru = (w) => RU_WARN.reduce((s, [a, b]) => s.replace(a, b), String(w));

// ---------------------------------------------------------------- table
function stateCell(r) {
  if (S.running.has(r.host)) return '<span class="spin"></span> <span class="muted">опрашиваю</span>';
  const s = r.state;
  if (!s) return '<span class="muted">—</span>';
  if (s === 'UNREACHABLE') return '<span class="state crit">✖ недоступен</span>';
  if (s === 'crit') return '<span class="state crit">● крит</span>';
  if (s === 'warn') return '<span class="state warn">● внимание</span>';
  return '<span class="state ok">● ok</span>';
}
const pct = (v) => { const n = parseFloat(v); if (isNaN(n)) return ''; return '<span class="' + (n >= 90 ? 'crit' : n >= 80 ? 'warn' : '') + '">' + n + '%</span>'; };
function issues(r) {
  if (r.state === 'UNREACHABLE') return '<span class="crit">' + esc(String(r.error || '').split(' — ')[0]) + '</span>';
  const codes = String(r.issues || '').split(/\s+/).filter(Boolean);
  const count = new Map(); codes.forEach((c) => count.set(c, (count.get(c) || 0) + 1));
  return [...count].map(([c, n]) => '<span class="code' + (CRIT.has(c) ? ' crit' : '') + '" title="' + esc(CODES()[c] || c) + '">' + esc(CODES()[c] || c) + (n > 1 ? ' ×' + n : '') + '</span>').join('');
}
function renderRows() {
  const hosts = S.state.hosts.filter((h) => !h.disabled);
  $('rows').innerHTML = hosts.map((h) => {
    const r = S.rows.get(h.name) || { host: h.name };
    const [upd, sec] = String(r.updates || '').split('/');
    const load = r.load !== undefined ? r.load + (r.cpu ? '/' + r.cpu : '') : '';
    const k = r.load !== undefined && r.cpu ? r.load / r.cpu : 0;
    return '<tr class="host' + (S.sel.has(h.name) ? ' sel' : '') + '" data-h="' + esc(h.name) + '">' +
      '<td><input type="checkbox" ' + (S.sel.has(h.name) ? 'checked' : '') + '></td>' +
      '<td><b>' + esc(h.name) + '</b>' + (h.title ? ' <span>' + esc(h.title) + '</span>' : '') + '<div class="muted" style="font-size:12px">' + esc(h.roles.join(', ')) + '</div></td>' +
      '<td>' + stateCell(r) + '</td>' +
      '<td class="num hide-s ' + (k >= 1 ? 'crit' : k >= .7 ? 'warn' : '') + '">' + esc(load) + '</td>' +
      '<td class="num hide-s">' + pct(r.mem) + '</td><td class="num">' + pct(r.disk) + '</td>' +
      '<td>' + (upd ? esc(upd) + (sec ? ' <span class="warn">(' + esc(parseInt(sec)) + ' security)</span>' : '') : '') + '</td>' +
      '<td class="hide-s">' + (r.reboot ? '<span class="warn">нужен</span>' : '') + '</td>' +
      '<td class="hide-s">' + (r.node ? (r.node === 'running' ? '<span class="ok">✓</span>' : '<span class="crit">' + esc(r.node === 'absent' ? 'нет' : r.node) + '</span>') : '') + '</td>' +
      '<td class="num hide-s">' + (r.cert && r.cert !== '-' ? '<span class="' + (parseInt(r.cert) < 14 ? 'crit' : parseInt(r.cert) < 30 ? 'warn' : '') + '">' + parseInt(r.cert) + ' дн</span>' : '') + '</td>' +
      '<td class="hide-s">' + (r.ts === 'Running' ? '<span class="ok">✓</span>' + (r.tsKey ? ' <span class="warn">ключ ' + esc(r.tsKey) + '</span>' : '') : esc(r.ts || '')) + '</td>' +
      '<td class="hide-s">' + (r.panel ? (/^connected/.test(r.panel) ? '<span class="ok">✓</span> ' + esc(String(r.panel).replace(/^connected\s*/, '').replace(/u$/, '')) : '<span class="crit">' + esc(r.panel) + '</span>') : '') + '</td>' +
      '<td class="issues">' + issues(r) + '</td></tr>';
  }).join('');
  $('empty').style.display = hosts.length ? 'none' : 'block';
  $('empty').textContent = hosts.length ? '' : 'В fleet.yaml пока нет серверов: добавьте их в терминале — mia setup.';
  $('all').checked = hosts.length > 0 && hosts.every((h) => S.sel.has(h.name));
  renderBar();
}
$('rows').addEventListener('click', (e) => {
  const tr = e.target.closest('tr.host'); if (!tr) return;
  const h = tr.dataset.h;
  if (S.sel.has(h)) S.sel.delete(h); else S.sel.add(h);
  renderRows();
});
$('all').addEventListener('change', (e) => { S.sel = e.target.checked ? new Set(S.state.hosts.filter((h) => !h.disabled).map((h) => h.name)) : new Set(); renderRows(); });

function renderSummary() {
  const st = S.last;
  const chips = [];
  chips.push('<span class="chip">' + hostsWord(S.state.hosts.filter((h) => !h.disabled).length) + '</span>');
  if (st) {
    const s = st.summary;
    chips.push('<span class="chip ok">✔ ' + (s.ok || 0) + ' ok</span>');
    if (s.warn) chips.push('<span class="chip warn">▲ ' + s.warn + ' внимание</span>');
    if (s.crit) chips.push('<span class="chip crit">● ' + s.crit + ' крит</span>');
    if (s.unreachable) chips.push('<span class="chip crit">✖ ' + s.unreachable + ' недоступно</span>');
    chips.push('<span class="chip">статус ' + new Date(st.at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + '</span>');
  }
  if (S.state.readonly) chips.push('<span class="chip warn">только чтение</span>');
  if (S.state.demo) chips.push('<span class="chip crit" title="выдуманный флот: жать можно всё, настоящие серверы не трогаются">ДЕМО</span>');
  $('summary').innerHTML = chips.join('');
}
function renderSuggest() {
  $('suggestCard').style.display = S.suggest.length ? 'block' : 'none';
  $('suggest').innerHTML = S.suggest.map((n, i) => '<button data-i="' + i + '">' + esc(n.label) + (n.hint ? '<small>' + esc(n.hint) + '</small>' : '') + '</button>').join('');
}
$('suggest').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) runNext(S.suggest[+b.dataset.i]); });

function renderBar() {
  const n = S.sel.size;
  const who = n ? 'Выбрано: <b>' + n + '</b> <button class="link" id="clearSel">снять</button>' : 'Для всех серверов:';
  $('bar').innerHTML = '<span class="who">' + who + '</span>' + S.state.quick.filter((q) => q.tool !== 'fleet_status').map((q) => '<button data-t="' + q.tool + '"' + (tool(q.tool) && !tool(q.tool).readonly ? '' : '') + '>' + esc(q.title) + '</button>').join('') + '<button data-t="__more">Ещё…</button>';
}
$('bar').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'clearSel') { S.sel.clear(); renderRows(); return; }
  if (b.dataset.t === '__more') { $('q').focus(); return; }
  if (b.dataset.t) openAction(b.dataset.t, selectionPreset(b.dataset.t));
});
function selectionPreset(name) {
  const t = tool(name); if (!t) return {};
  const names = [...S.sel];
  const has = (f) => t.fields.some((x) => x.name === f);
  if (names.length && has('target')) return { target: names.join(',') };
  if (names.length === 1 && has('host')) return { host: names[0] };
  if (!names.length && has('target') && name !== 'host_reboot') return { target: name === 'remnanode_update' ? 'role:remnanode' : 'all' };
  return {};
}

// ---------------------------------------------------------------- status
async function refresh() {
  $('refresh').disabled = true;
  S.running = new Set(S.state.hosts.filter((h) => !h.disabled).map((h) => h.name));
  renderRows();
  try {
    const res = await job('fleet_status', { target: 'all', tailnet: true }, (p) => {
      if (p.kind === 'host' && p.state !== 'run') { S.running.delete(p.host); renderRows(); }
    });
    S.running.clear();
    if (!res.ok) throw new Error(res.error);
    const d = res.data;
    S.rows = new Map(d.rows.filter((r) => r.state !== 'not in fleet.yaml' && r.state !== 'offline').map((r) => [r.host, r]));
    S.last = { at: Date.now(), summary: d.summary };
    S.suggest = (res.next || []).filter((n) => n.tool !== 'fleet_audit' || true);
    const extra = d.rows.filter((r) => r.state === 'not in fleet.yaml' || r.state === 'offline');
    $('extraCard').style.display = extra.length ? 'block' : 'none';
    $('extra').innerHTML = extra.length ? '<table><tr><th>устройство</th><th>сеть</th><th>ОС</th><th>что видно</th></tr>' + extra.map((r) => '<tr><td>' + esc(r.host) + '</td><td>' + (r.state === 'offline' ? '<span class="muted">не в сети</span>' : '<span class="ok">в сети</span>') + '</td><td>' + esc(r.os || '') + '</td><td>' + esc(r.error ? String(r.error).split(' — ')[0] : r.up ? 'ssh ✓ · аптайм ' + r.up : '—') + '</td></tr>').join('') + '</table><p class="muted">Добавить их в fleet.yaml: в терминале <kbd>mia setup</kbd> → «Хосты: добавить из tailnet».</p>' : '';
    const notes = [];
    if (S.state.demo) { /* the demo has no panel and a pretend tailnet on purpose */ }
    else if (d.panel && /^not configured/.test(d.panel)) notes.push('Панель не подключена — состояние нод в панели не видно (mia setup → «Панель Remnawave»).');
    else if (d.panel && !/^ok/.test(d.panel)) notes.push('Панель не ответила: ' + d.panel.replace(/^error: /, ''));
    if (d.tailnet && /^unavailable/.test(d.tailnet)) notes.push('Tailnet не виден: ' + d.tailnet.replace(/^unavailable: /, ''));
    showNotices(notes);
  } catch (e) {

  if (n.setup) { alert('Это делается в терминале: mia setup → «Хосты: добавить из tailnet»'); return; }
  openAction(n.tool, n.preset || {}, 'auto');
}

// ---------------------------------------------------------------- start
(async () => {
  try { S.state = await api('api/state'); }
  catch (e) { document.body.innerHTML = '<p style="margin:40px">' + esc(e.message) + '</p>'; return; }
  renderSummary(); renderRows();
  S.runningNotes = (S.state.running || []).map((j) => 'Идёт: ' + j.title + (j.apply ? ' (выполнение)' : ' (план)') + (j.target ? ' — ' + j.target : '') + ', с ' + new Date(j.at).toLocaleTimeString('ru') + '. Не запускайте то же ещё раз, пока не закончится.');
  showNotices([]);
  if (S.state.hosts.length) refresh();
})();
</script>
